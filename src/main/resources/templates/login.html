<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Nhập Hệ Thống</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4 border-0 rounded-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 65px; height: 65px;">
                <i class="fas fa-user-lock fa-2x"></i>
            </div>
            <h3 class="fw-bold text-dark">Đăng Nhập Hệ Thống</h3>
            <p class="text-muted small">Vui lòng nhập thông tin tài khoản của bạn</p>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
            <i class="fas fa-exclamation-circle me-1"></i> Sai tên đăng nhập hoặc mật khẩu!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <!-- Thông báo đăng xuất -->
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show py-2" role="alert">
            <i class="fas fa-check-circle me-1"></i> Đăng xuất thành công!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Bắt buộc th:action="@{/login}" để khớp với Spring Security -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary"><i class="fas fa-user me-1"></i> Tài khoản</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập tài khoản..." required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary"><i class="fas fa-lock me-1"></i> Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                <i class="fas fa-sign-in-alt me-1"></i> Đăng Nhập
            </button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
