<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang Chủ - Quản Lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-shield-alt me-2"></i>Spring Security Demo</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Xin chào, <strong th:text="${#authentication.name}">User</strong></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="fas fa-sign-out-alt me-1"></i> Đăng xuất</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="p-5 mb-4 bg-white rounded-4 shadow-sm border">
            <div class="container-fluid py-3">
                <h1 class="display-5 fw-bold text-primary">Chào mừng bạn đến với hệ thống!</h1>
                <p class="col-md-8 fs-4 text-secondary">Ứng dụng đã được bảo mật thành công bằng Spring Security và kết nối Database MySQL.</p>
                <hr class="my-4">
                <div class="d-flex gap-3">
                    <a th:href="@{/admin}" class="btn btn-dark btn-lg"><i class="fas fa-user-shield me-1"></i> Khu vực Admin</a>
                    <a th:href="@{/user}" class="btn btn-outline-primary btn-lg"><i class="fas fa-user me-1"></i> Khu vực User</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
